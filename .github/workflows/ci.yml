# SPDX-License-Identifier: AGPL-3.0
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
    branches: [main]

concurrency: ci-${{ github.ref }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -race
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o gitli-runner .
      - name: Version
        run: ./gitli-runner version
